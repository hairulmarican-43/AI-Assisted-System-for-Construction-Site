# Streamlit theme. Must live in .streamlit/config.toml at the repo root,
# or it is ignored. Colours here match ui_theme.py.

[theme]
# Main canvas: light blue-grey page, white cards, coral accent.
base = "light"
primaryColor = "#F07C5F"
backgroundColor = "#E9EFF5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2A2E45"
baseRadius = "0.6rem"

# Sidebar is dark navy; ui_theme.py keeps the text inside input
# fields dark so typed values stay readable.
[theme.sidebar]
backgroundColor = "#1F2233"
textColor = "#DDE1EC"
